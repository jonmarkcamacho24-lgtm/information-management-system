const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const monthKey = (d=new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
function when(ts){
  if(!ts) return 'Never';
  const d=new Date(ts), n=new Date(), y=new Date(); y.setDate(n.getDate()-1);
  const t=d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===n.toDateString()) return 'Today, '+t;
  if(d.toDateString()===y.toDateString()) return 'Yesterday, '+t;
  return d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})+', '+t;
}
async function hash(s){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('oz:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'b64:' + btoa(unescape(encodeURIComponent('oz:'+s))); }
}

let db = null;
const SEED = []; // no sample menu items
async function seed(){
  const ha = await hash('admin123');
  return {
    v:1,
    users:[{id:'u1', name:'Oz Admin', username:'admin', email:'', role:'Admin', active:true, passHash:ha, lastLogin:Date.now()}],
    menu:[], stock:{date:Date.now(), items:{}},
    targets:{daily:30000, monthly:850000},
    monthSales:0, monthKey:monthKey()
  };
}
function save(){ store.set(KEY, JSON.stringify(db)); }
async function load(){
  try{
    const raw = store.get(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.users && d.menu && d.stock) { db = d; }
    }
  }catch(e){}
  if(!db){ db = await seed(); save(); }
  if(db.monthKey !== monthKey()){ db.monthSales = 0; db.monthKey = monthKey(); save(); }
}
const calc = s => {
  const total = s.prev + s.restock, expected = total - s.sold;
  return { total, expected, lost: s.closed==null ? null : expected - s.closed, left: s.closed==null ? expected : s.closed };
};
const stockOf = id => db.stock.items[id] || (db.stock.items[id] = {prev:0,restock:0,sold:0,closed:null});
function todaySales(){ return db.menu.reduce((t,m)=>t + stockOf(m.id).sold * m.price, 0); }
function lowItems(){ return db.menu.filter(m => calc(stockOf(m.id)).left <= LOW); }
const activeAdmins = () => db.users.filter(u=>u.role==='Admin' && u.active);
const me = () => { const id = sess.get(SKEY); return db.users.find(u=>u.id===id && u.role==='Admin' && u.active) || null; };

/* ================= modal & toast ================= */
const dlg = $('#dlg');
dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });
function modal(title, body, opt={}){
  const {submit='Save', danger=false, onSubmit, hideCancel=false} = opt;
  dlg.innerHTML = `<form class="mform" novalidate><h2>${esc(title)}</h2>${body}<div class="form-error" role="alert"></div>
    <div class="btns">${hideCancel?'':'<button type="button" class="btn ghost" data-close>Cancel</button>'}<button class="btn ${danger?'danger':''}" type="submit">${esc(submit)}</button></div></form>`;
  const f = $('form', dlg);
  $('[data-close]', dlg)?.addEventListener('click', ()=>dlg.close());
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const err = await onSubmit(new FormData(f), f);
    if(err){ $('.form-error', f).textContent = err; } else { dlg.close(); }
  });
  dlg.showModal();
}
function confirmBox(title, msg, label, fn, danger=true){
  modal(title, `<p class="muted">${msg}</p>`, {submit:label, danger, onSubmit: async()=>{ await fn(); }});
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 2600);
}

function ring(label, amount, target){
  const pct = target>0 ? amount/target : 0, r = 92, C = 2*Math.PI*r, off = C*(1-Math.min(pct,1));
  return `<div class="ring ${pct>=1?'done':''}"><div class="rw">
    <svg viewBox="0 0 208 208" aria-hidden="true"><circle class="tr" cx="104" cy="104" r="${r}"/><circle class="pg" cx="104" cy="104" r="${r}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="in"><span class="l">${label}</span><span class="a num">${peso(amount)}</span><span class="p num">${Math.round(pct*100)}%</span></div></div>
    <p class="cap num">Target ${peso(target)}</p></div>`;
}

        <td>${inp('prev','previous stock')}</td><td>${inp('restock','restock')}</td><td class="tot num" data-o="total"></td>
        <td>${inp('closed','closed shift count')}</td><td>${inp('sold','POS sold')}</td><td class="num" data-o="lost"></td></tr>`;
    });
  });
  return html || `<tr><td colspan="7"><div class="empty"><b>No items found</b>Try a different search or category.</div></td></tr>`;
}
function paintRow(tr){
  const m = db.menu.find(x=>x.id===tr.dataset.id); if(!m) return;
  const c = calc(stockOf(m.id));
  $('[data-o="total"]', tr).textContent = c.total;
  const l = $('[data-o="lost"]', tr);
  if(c.lost==null){ l.innerHTML = '<span class="lost none">—</span>'; }
  else if(c.lost>0){ l.innerHTML = `<span class="lost bad">${c.lost}</span>`; }
  else if(c.lost<0){ l.innerHTML = `<span class="lost over" title="Counted more than expected">+${-c.lost} over</span>`; }
  else { l.innerHTML = '<span class="lost none">0</span>'; }
  $('.tagslot', tr).innerHTML = c.left<=LOW ? `<span class="tag low">${c.left<=0?'Out':'Low'} · ${Math.max(c.left,0)} left</span>` : '';
}
function paintStats(){
  let sold=0, lost=0, counted=0;
  db.menu.forEach(m => { const s = stockOf(m.id), c = calc(s); sold += s.sold; if(c.lost!=null){ counted++; if(c.lost>0) lost += c.lost; } });
  $('#st-sold').textContent = sold; $('#st-lost').textContent = lost;
  $('#st-count').textContent = counted + ' / ' + db.menu.length; $('#st-low').textContent = lowItems().length;
  $('#st-sales').textContent = peso(todaySales());
}

  <div class="toolbar"><div class="search"><label class="sr" for="sq">Search stock</label>${ic('search')}<input class="input" id="sq" type="search" placeholder="Search food list" value="${esc(ui.stockQ)}"></div>
    <label class="sr" for="sc">Category</label><select class="input" id="sc" style="width:auto">${['All',...CATS].map(c=>`<option ${c===ui.stockCat?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="tw"><table class="st"><thead><tr><th scope="col">Food list</th><th scope="col">Previous stock</th><th scope="col">Restock</th><th scope="col">Total</th><th scope="col">Closed shift</th><th scope="col">POS sold</th><th scope="col">Lost</th></tr></thead><tbody id="sbody"></tbody></table></div>
  <p class="hint" style="margin-top:12px">Total = previous stock + restock. Lost = total − closed shift count − POS sold. Leave closed shift blank until the count is done.</p>`;
}
function drawStock(){ $('#sbody').innerHTML = stockRows(); $$('#sbody tr[data-id]').forEach(paintRow); paintStats(); }
function bindStock(){
  drawStock();
  $('#sq').oninput = e => { ui.stockQ = e.target.value; drawStock(); };
  $('#sc').onchange = e => { ui.stockCat = e.target.value; drawStock(); };
  $('#sbody').addEventListener('input', e => {
    const i = e.target.closest('input[data-f]'); if(!i) return;
    const tr = i.closest('tr'), f = i.dataset.f, s = stockOf(tr.dataset.id);
    s[f] = i.value==='' ? (f==='closed' ? null : 0) : Math.max(0, Math.floor(+i.value || 0));
    save(); paintRow(tr); paintStats();
  });
  $('#closeShift').onclick = () => {
    const sales = todaySales(), open = db.menu.filter(m=>stockOf(m.id).closed==null).length;
    confirmBox('Close today’s shift?',
      `${peso(sales)} in POS sales will be added to monthly sales. Closed shift counts become the previous stock, and restock and POS sold reset to 0.${open ? ` <b>${open} item${open>1?'s have':' has'} no closed count</b> — the expected count will be used.` : ''}`,
      'Close shift', () => {
        db.menu.forEach(m => { const s = stockOf(m.id), c = calc(s); s.prev = Math.max(0, c.left); s.restock = 0; s.sold = 0; s.closed = null; });
        db.monthSales += sales; db.stock.date = Date.now(); save(); route(); toast('Shift closed');
      }, false);
  };
}

/* ================= Users ================= */
function viewUsers(){
  const meId = me().id;
  return `
  <div class="ph"><div><h1>Users</h1><p class="sub">${db.users.length} accounts · ${activeAdmins().length} active admin${activeAdmins().length===1?'':'s'}</p></div>
    <button class="btn" id="addU">${ic('plus')}Add user</button></div>
  <div class="note">${ic('info')}<span>Only active admin accounts can sign in to this site. Staff accounts are kept for your records.</span></div>
  <div class="list"><table class="ut"><thead><tr><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col" class="hide-s">Last sign-in</th><th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody>
  ${db.users.map(u=>`<tr><td><div class="who2"><span class="av">${esc(initials(u.name))}</span><div><b>${esc(u.name)}${u.id===meId?' <span class="tag off">You</span>':''}</b><span>@${esc(u.username)}</span></div></div></td>
    <td>${u.role}</td><td><span class="tag ${u.active?'good':'off'}" style="margin:0">${u.active?'Active':'Inactive'}</span></td><td class="hide-s muted">${when(u.lastLogin)}</td>
    <td><div class="acts"><button class="icon-btn" data-e="${u.id}" aria-label="Edit ${esc(u.name)}">${ic('pencil')}</button><button class="icon-btn" data-d="${u.id}" aria-label="Delete ${esc(u.name)}" ${u.id===meId?'disabled style="opacity:.35;cursor:not-allowed"':''}>${ic('trash')}</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
}
function userModal(id){
  const isNew = !id, u = isNew ? {name:'',username:'',role:'Staff',active:true} : db.users.find(x=>x.id===id), self = !isNew && u.id===me().id;
  modal(isNew?'Add user':'Edit user', `
    <div class="field"><label for="un">Full name</label><input class="input" id="un" name="name" value="${esc(u.name)}" autocomplete="off"></div>
    <div class="field"><label for="uu">Username</label><input class="input" id="uu" name="username" value="${esc(u.username)}" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
    <div class="two"><div class="field"><label for="ur">Role</label><select class="input" id="ur" name="role" ${self?'disabled':''}><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Staff'?'selected':''}>Staff</option></select></div>
    <div class="field"><label for="us">Status</label><select class="input" id="us" name="status" ${self?'disabled':''}><option value="1" ${u.active?'selected':''}>Active</option><option value="0" ${!u.active?'selected':''}>Inactive</option></select></div></div>
    <div class="field"><label for="up">${isNew?'Password':'New password'}</label><input class="input" id="up" name="pw" type="password" autocomplete="new-password" placeholder="${isNew?'At least 6 characters':'Leave blank to keep the current one'}"></div>
    ${self?'<p class="hint">You can’t change your own role or status.</p>':''}`,
    {submit:isNew?'Add user':'Save changes', onSubmit: async fd => {
      const name = fd.get('name').trim(), un = fd.get('username').trim().toLowerCase(), pw = fd.get('pw');
      const role = self ? u.role : fd.get('role'), active = self ? u.active : fd.get('status')==='1';
      if(!name) return 'Enter the user’s full name.';
      if(!/^[a-z0-9._-]{3,}$/.test(un)) return 'Username needs 3 or more letters, numbers, dots, dashes or underscores.';
      if(db.users.some(x=>x.id!==id && x.username.toLowerCase()===un)) return 'That username is taken. Choose another.';
      if(isNew && pw.length<6) return 'Password needs at least 6 characters.';
      if(pw && pw.length<6) return 'New password needs at least 6 characters.';
      if(!isNew && u.role==='Admin' && u.active && !(role==='Admin' && active) && activeAdmins().length<=1) return 'At least one active admin is required.';
      const patch = {name, username:un, role, active};
      if(pw) patch.passHash = await hash(pw);
      if(isNew) db.users.push({id:uid('u'), email:'', lastLogin:null, passHash:patch.passHash, ...patch}); else Object.assign(u, patch);
      save(); route(); toast(isNew?'User added':'User saved');
    }});
}
function bindUsers(){
  $('#addU').onclick = () => userModal();
  $$('[data-e]').forEach(b => b.onclick = () => userModal(b.dataset.e));
  $$('[data-d]').forEach(b => b.onclick = () => {
    const u = db.users.find(x=>x.id===b.dataset.d);
    if(u.role==='Admin' && u.active && activeAdmins().length<=1){ toast('At least one active admin is required'); return; }
    confirmBox('Delete user', `Delete <b>${esc(u.name)}</b> (@${esc(u.username)})? This can’t be undone.`, 'Delete user', ()=>{ db.users = db.users.filter(x=>x.id!==u.id); save(); route(); toast('User deleted'); });
  });
}

/* ================= Profile ================= */
function viewProfile(){
  const u = me();
  return `
  <div class="ph"><div><h1>Profile</h1><p class="sub">Your admin account details and password.</p></div></div>
  <div class="prof">
    <section class="panel"><div class="head"><span class="av big">${esc(initials(u.name))}</span><div><h2>${esc(u.name)}</h2><p class="muted">Admin · last sign-in ${when(u.lastLogin)}</p></div></div>
      <form id="pf" novalidate>
        <div class="field"><label for="pn">Full name</label><input class="input" id="pn" name="name" value="${esc(u.name)}" autocomplete="name"></div>
        <div class="field"><label for="pe">Email</label><input class="input" id="pe" name="email" type="email" value="${esc(u.email)}" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label for="pu">Username</label><input class="input" id="pu" value="${esc(u.username)}" readonly><span class="hint">Ask another admin to change your username from Users.</span></div>
        <div class="form-error" id="pfe" role="alert"></div>
        <div><button class="btn" type="submit">Save profile</button></div>
      </form></section>
    <section class="panel"><h2>Change password</h2>
      <form id="pw" novalidate>
        <div class="field"><label for="cp">Current password</label><input class="input" id="cp" name="cur" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="np">New password</label><input class="input" id="np" name="nw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="field"><label for="rp">Confirm new password</label><input class="input" id="rp" name="cf" type="password" autocomplete="new-password"></div>
        <div class="form-error" id="pwe" role="alert"></div>
        <div><button class="btn" type="submit">Update password</button></div>
      </form></section>
    <section class="panel span2"><div class="rowbtw"><div><h3>Session</h3><p class="muted">Sign out when you leave the counter or share a device.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="reset">Reset sample data</button><button class="btn" id="so">${ic('logout')}Sign out</button></div></div></section>
  </div>`;
}
function bindProfile(){
  const u = me();
  $('#pf').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#pn').value.trim(), email = $('#pe').value.trim(), err = $('#pfe');
    if(!name){ err.textContent = 'Enter your full name.'; return; }
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ err.textContent = 'Enter a valid email address, like name@example.com.'; return; }
    u.name = name; u.email = email; save(); route(); toast('Profile saved');
  });
  $('#pw').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#pwe'), cur = $('#cp').value, nw = $('#np').value, cf = $('#rp').value;
    if(await hash(cur) !== u.passHash){ err.textContent = 'Current password is incorrect.'; return; }
    if(nw.length<6){ err.textContent = 'New password needs at least 6 characters.'; return; }
    if(nw!==cf){ err.textContent = 'New passwords don’t match.'; return; }
    u.passHash = await hash(nw); save(); e.target.reset(); err.textContent = ''; toast('Password updated');
  });
  $('#so').onclick = logout;
  $('#reset').onclick = () => confirmBox('Reset sample data', 'This replaces the menu, stock, users and targets with the original sample data, and signs you out.', 'Reset data', async()=>{ db = await seed(); save(); logout(); });
}

/* ================= router ================= */
const VIEWS = {home:[viewHome,bindHome], menu:[viewMenu,bindMenu], stock:[viewStock,bindStock], users:[viewUsers,bindUsers], profile:[viewProfile,bindProfile]};
function route(){
  if(dlg.open) dlg.close();
  if(!me()){ renderLogin(); return; }
  let v = location.hash.replace(/^#\//,'').split('?')[0]; if(!VIEWS[v]) v = 'home';
  const [render, bind] = VIEWS[v];
  document.title = TABS.find(t=>t.id===v).label + ' · OZ Café Admin';
  shell(v, render()); bind(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
load().then(()=>{
  const hs = location.hash;
  if(!me() && hs) history.replaceState(null,'',location.pathname);
  route();
});
</script>
</body>
